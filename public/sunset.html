
<!DOCTYPE html>
<html>

<head>
<title>Asheville Sunset Index</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>

body {
font-family: Arial;
background: #0b1a2a;
color: white;
text-align: center;
padding-top: 80px;
}

.score {
font-size: 72px;
color: orange;
}

</style>
</head>

<body>

<h1>Asheville Sunset Vibrance Index</h1>

<div class="score" id="score">Loading...</div>
<div id="alert"></div>
<script>

async function loadSunset() {

const response = await fetch("/api/sunsetAlert");
const data = await response.json();

let label = "";

if (data.sunsetIndex >= 90) label = "🔥 Epic sunset likely";
else if (data.sunsetIndex >= 80) label = "🌇 Spectacular";
else if (data.sunsetIndex >= 70) label = "🌄 Very good";
else if (data.sunsetIndex >= 55) label = "🙂 Decent";
else if (data.sunsetIndex >= 40) label = "😐 Average";
else label = "☁️ Poor";

document.getElementById("score").innerText =
data.sunsetIndex + " — " + label;

if (data.alert) {

document.getElementById("alert").innerHTML =
"<h2>🌇 Sunset Alert</h2>" +
"<p>" + data.alert.message + "</p>" +
"<p>Peak color: " + data.alert.peakColorWindow + "</p>";

}

}

loadSunset();

</script>

</body>

</html>
