
<!DOCTYPE html>
<html>

<head>
<title>Asheville Sunset Index</title>
<style>

body {
font-family: Arial;
background: #0b1a2a;
color: white;
text-align: center;
padding-top: 80px;
}

.score {
font-size: 72px;
color: orange;
}

</style>
</head>

<body>

<h1>Asheville Sunset Vibrance Index</h1>

<div class="score" id="score">Loading...</div>

<script>

async function loadSunset() {

const response = await fetch("/api/sunsetIndex");
const data = await response.json();

let label = "";

if (data.sunsetIndex >= 90) label = "🔥 Epic sunset likely";
else if (data.sunsetIndex >= 80) label = "🌇 Spectacular";
else if (data.sunsetIndex >= 70) label = "🌄 Very good";
else if (data.sunsetIndex >= 55) label = "🙂 Decent";
else if (data.sunsetIndex >= 40) label = "😐 Average";
else label = "☁️ Poor";

document.getElementById("score").innerText =
data.sunsetIndex + " — " + label;

}

loadSunset();

</script>

</body>

</html>
