<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alert Composer - 828 Weather</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121a2b;
    --line: rgba(255,255,255,0.12);
    --text: #e8eefc;
    --muted: #9fb0d1;
    --blue: #6ea8ff;
    --orange: #db6e2d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  main {
    width: min(1080px, calc(100vw - 28px));
    margin: 0 auto;
    padding: 24px 0 40px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    color: var(--blue);
    font-size: 28px;
  }

  .sub {
    margin-top: 5px;
    color: var(--muted);
    font-size: 14px;
  }

  .admin-link {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
    gap: 14px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  label {
    display: grid;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #0e1728;
    color: var(--text);
    font: inherit;
    padding: 10px 11px;
  }

  textarea {
    min-height: 112px;
    resize: vertical;
  }

  .full {
    grid-column: 1 / -1;
  }

  .check-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 0;
    color: var(--text);
    font-size: 14px;
  }

  .check-row input {
    width: 18px;
    height: 18px;
  }

  .actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  button {
    border: 0;
    border-radius: 8px;
    background: var(--orange);
    color: white;
    padding: 11px 14px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  button.secondary {
    background: rgba(255,255,255,0.12);
  }

  button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .status {
    color: var(--muted);
    min-height: 22px;
    font-size: 14px;
  }

  .push-diagnostics {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .preview {
    display: grid;
    gap: 6px;
    padding: 14px;
    border-radius: 8px;
    background: #253b66;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .preview.notable { background: #6f4f18; }
  .preview.urgent { background: #7a2530; }

  .preview-meta {
    color: rgba(255,255,255,0.76);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .preview-title {
    font-size: 18px;
    font-weight: 850;
  }

  .preview-body,
  .preview-action {
    font-size: 14px;
    line-height: 1.4;
  }

  .preview-action {
    color: rgba(255,255,255,0.84);
  }

  .active-list {
    display: grid;
    gap: 10px;
    margin-top: 14px;
  }

  .active-item {
    display: grid;
    gap: 5px;
    padding: 12px;
    border-radius: 8px;
    background: #0e1728;
    border: 1px solid var(--line);
  }

  .active-item strong {
    color: #fff;
  }

  .active-item span {
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 820px) {
    .layout,
    .grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1>Alert Composer</h1>
      <div class="sub">Publish site alerts and optionally send push notifications.</div>
    </div>
    <a class="admin-link" href="/admin/index.html">Admin home</a>
  </div>

  <div class="layout">
    <section class="panel">
      <div class="grid">
        <label>
          Alert type
          <select id="type">
            <option value="weather-alert">Weather alert</option>
            <option value="timing-change">Timing change</option>
            <option value="storms">Storms</option>
            <option value="heavy-rain">Heavy rain</option>
            <option value="snow-ice">Snow / ice</option>
            <option value="fog">Fog</option>
            <option value="wind">Wind</option>
            <option value="temperature">Temperature</option>
            <option value="fire-weather">Fire weather</option>
            <option value="air-quality">Air quality</option>
            <option value="site-notice">Site notice</option>
          </select>
        </label>

        <label>
          Severity
          <select id="severity">
            <option value="heads-up">Heads up</option>
            <option value="notable">Notable</option>
            <option value="urgent">Urgent</option>
          </select>
        </label>

        <label>
          Area
          <input id="area" value="Asheville and nearby 828 communities" />
        </label>

        <label>
          Timing
          <input id="timing" value="Now" />
        </label>

        <label class="full">
          Alert title
          <input id="title" placeholder="Gusty storms possible later today" />
        </label>

        <label class="full">
          Main message
          <textarea id="message" placeholder="Showers and storms may build west of Asheville later this afternoon, with brief heavy rain and gusty wind possible."></textarea>
        </label>

        <label class="full">
          Action note
          <input id="action" placeholder="Keep an eye on radar if you have evening plans." />
        </label>

        <label>
          Link target
          <select id="url">
            <option value="/">Home</option>
            <option value="/forecast.html">4-day Forecast</option>
            <option value="/pulse.html">Weather Pulse</option>
          </select>
        </label>

        <label>
          Expires
          <input id="expiresAt" type="datetime-local" />
        </label>
      </div>

      <label class="check-row">
        <input id="sendPush" type="checkbox" checked />
        <span id="subscriberLabel">Send push notification to subscribers</span>
      </label>

      <div class="actions">
        <button id="publishBtn" type="button">Publish Alert</button>
        <button id="clearBtn" class="secondary" type="button">Clear Active Alerts</button>
        <span class="status" id="status"></span>
      </div>
      <div class="push-diagnostics" id="pushDiagnostics"></div>
    </section>

    <aside class="panel">
      <h2 style="margin:0 0 12px;font-size:18px;">Preview</h2>
      <div id="preview" class="preview"></div>

      <h2 style="margin:18px 0 0;font-size:18px;">Active Alerts</h2>
      <div id="activeList" class="active-list"></div>
    </aside>
  </div>
</main>

<script>
  const fields = {
    type: document.getElementById("type"),
    severity: document.getElementById("severity"),
    area: document.getElementById("area"),
    timing: document.getElementById("timing"),
    title: document.getElementById("title"),
    message: document.getElementById("message"),
    action: document.getElementById("action"),
    url: document.getElementById("url"),
    expiresAt: document.getElementById("expiresAt"),
    sendPush: document.getElementById("sendPush")
  };

  const statusEl = document.getElementById("status");
  const previewEl = document.getElementById("preview");
  const activeList = document.getElementById("activeList");
  const publishBtn = document.getElementById("publishBtn");
  const clearBtn = document.getElementById("clearBtn");
  const subscriberLabel = document.getElementById("subscriberLabel");
  const pushDiagnostics = document.getElementById("pushDiagnostics");

  function setDefaultExpiry() {
    const d = new Date(Date.now() + 6 * 60 * 60 * 1000);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    fields.expiresAt.value = d.toISOString().slice(0, 16);
  }

  function getPayload() {
    return {
      type: fields.type.value,
      severity: fields.severity.value,
      area: fields.area.value,
      timing: fields.timing.value,
      title: fields.title.value,
      message: fields.message.value,
      action: fields.action.value,
      url: fields.url.value,
      expiresAt: fields.expiresAt.value ? new Date(fields.expiresAt.value).toISOString() : "",
      sendPush: fields.sendPush.checked
    };
  }

  function updatePreview() {
    const data = getPayload();
    previewEl.className = `preview ${data.severity}`;
    previewEl.innerHTML = `
      <div class="preview-meta">${escapeHtml(formatType(data.type))} - ${escapeHtml(data.timing || "Now")}</div>
      <div class="preview-title">${escapeHtml(data.title || "Alert title")}</div>
      <div class="preview-body">${escapeHtml(data.message || "Main alert message will appear here.")}</div>
      ${data.action ? `<div class="preview-action">${escapeHtml(data.action)}</div>` : ""}
    `;
  }

  async function publishAlert() {
    const payload = getPayload();
    if (!payload.title.trim() || !payload.message.trim()) {
      setStatus("Add a title and message first.");
      return;
    }

    publishBtn.disabled = true;
    setStatus(payload.sendPush ? "Publishing and sending push..." : "Publishing site alert...");

    try {
      const res = await fetch("/api/router?route=alerts/publish", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const result = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(result.error || "Publish failed");
      if (!result.pushed) {
        setStatus("Published to homepage.");
      } else if (result.pushResult?.skipped) {
        setStatus("Published to homepage. Push skipped: VAPID keys are not configured.");
      } else if (result.pushResult?.sent > 0) {
        const failed = result.pushResult.failed ? ` ${result.pushResult.failed} failed.` : "";
        setStatus(`Published to homepage. Push sent to ${result.pushResult.sent} subscriber${result.pushResult.sent === 1 ? "" : "s"}.${failed}`);
      } else {
        setStatus("Published to homepage. No push subscribers were found.");
      }
      await loadActiveAlerts();
    } catch (err) {
      console.error(err);
      setStatus("Publish failed.");
    } finally {
      publishBtn.disabled = false;
    }
  }

  async function clearAlerts() {
    clearBtn.disabled = true;
    setStatus("Clearing active alerts...");
    try {
      const res = await fetch("/api/router?route=alerts/clear", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      if (!res.ok) throw new Error("Clear failed");
      setStatus("Active alerts cleared.");
      await loadActiveAlerts();
    } catch (err) {
      console.error(err);
      setStatus("Clear failed.");
    } finally {
      clearBtn.disabled = false;
    }
  }

  async function loadActiveAlerts() {
    try {
      const res = await fetch("/api/router?route=alerts/latest", { cache: "no-store" });
      const data = await res.json();
      const alerts = Array.isArray(data.alerts) ? data.alerts : [];
      activeList.innerHTML = alerts.length
        ? alerts.map(alert => `
          <div class="active-item">
            <strong>${escapeHtml(alert.title)}</strong>
            <span>${escapeHtml(formatType(alert.type))} - ${escapeHtml(alert.timing || "Now")}</span>
            <span>Expires ${new Date(alert.expiresAt).toLocaleString()}</span>
          </div>
        `).join("")
        : `<div class="active-item"><span>No active alerts.</span></div>`;
    } catch {
      activeList.innerHTML = `<div class="active-item"><span>Unable to load active alerts.</span></div>`;
    }
  }

  async function loadNotificationStatus() {
    try {
      const res = await fetch("/api/router?route=notifications/status", { cache: "no-store" });
      if (!res.ok) return;
      const data = await res.json();
      if (Number.isFinite(data.subscriberCount)) {
        subscriberLabel.textContent = `Send push notification to ${data.subscriberCount} subscriber${data.subscriberCount === 1 ? "" : "s"}`;
      }

      if (data.pushConfig) {
        const config = data.pushConfig;
        const keyState = config.vapidReady
          ? "VAPID ready"
          : "VAPID not ready";
        const whitespace = config.publicKeyHasWhitespace || config.privateKeyHasWhitespace
          ? " Whitespace was detected in one or both VAPID env vars."
          : "";
        pushDiagnostics.textContent = `${keyState}. Public key: ${config.hasPublicKey ? "present" : "missing"}. Private key: ${config.hasPrivateKey ? "present" : "missing"}.${whitespace}`;
      }
    } catch {
      // Keep the default label when status is unavailable.
    }
  }

  function setStatus(message) {
    statusEl.textContent = message || "";
  }

  function formatType(type = "") {
    return String(type).replace(/-/g, " ").replace(/\b\w/g, char => char.toUpperCase());
  }

  function escapeHtml(value = "") {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  Object.values(fields).forEach(field => {
    field.addEventListener("input", updatePreview);
    field.addEventListener("change", updatePreview);
  });

  publishBtn.addEventListener("click", publishAlert);
  clearBtn.addEventListener("click", clearAlerts);

  setDefaultExpiry();
  updatePreview();
  loadActiveAlerts();
  loadNotificationStatus();
</script>
</body>
</html>
