<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>828 Weather Pulse Composer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0a0f1c;
      color: #e5e7eb;
      margin: 0;
      padding: 1.2rem;
    }

    .container {
      max-width: 640px;
      margin: auto;
    }

    .card {
      background: #141a2a;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #9aa3c2;
      margin-bottom: 1rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #8fb7ff;
      display: block;
      margin-bottom: 0.35rem;
    }

    .toolbar {
      margin-bottom: 0.4rem;
    }

    .toolbar button {
      background: rgba(255,255,255,0.05);
      border: none;
      color: #e5e7eb;
      padding: 4px 8px;
      margin-right: 4px;
      border-radius: 6px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: rgba(255,255,255,0.1);
    }

    #editor {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      min-height: 140px;
      padding: 0.6rem;
      background: #0f1525;
    }

    #editor:focus {
      outline: 2px solid #8fb7ff;
    }

    input[type="file"] {
      color: #cbd5f5;
      font-size: 0.8rem;
    }

    button.primary {
      background: linear-gradient(135deg, #4f7cff, #8fb7ff);
      color: white;
      border-radius: 999px;
      border: none;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      font-weight: 500;
    }

    button.primary:disabled {
      opacity: 0.5;
    }

    #status {
      font-size: 0.8rem;
      margin-left: 0.5rem;
      color: #9aa3c2;
    }

    .preview {
      margin-top: 1rem;
    }

    .pulse-hero-preview {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }

    .pulse-hero-preview img,
    .pulse-hero-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
    }

    .pulse-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    }

    .pulse-hero-text {
      position: absolute;
      bottom: 0;
      padding: 0.6rem;
      font-size: 0.85rem;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <h1>828 Weather Pulse</h1>
      <div class="subtitle">Compose a quick update</div>

      <div class="field">
        <label>Content</label>

        <div class="toolbar">
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="createLink">Link</button>
        </div>

        <div id="editor" contenteditable="true"></div>
      </div>

      <div class="field">
        <label>Media</label>
        <input type="file" id="image" accept="image/*,video/mp4" />
      </div>

      <div class="field">
        <button class="primary" id="publish">Publish</button>
        <span id="status"></span>
      </div>

      <div class="preview">
        <div id="preview-content"></div>
      </div>

    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview-content');
    const imageInput = document.getElementById('image');
    const publishBtn = document.getElementById('publish');
    const statusEl = document.getElementById('status');

    let currentImageUrl = "";

    document.querySelectorAll('.toolbar button').forEach(btn => {
      btn.addEventListener('click', () => {
        const cmd = btn.dataset.cmd;

        if (cmd === 'createLink') {
          const url = prompt('Enter URL:');
          if (url) document.execCommand(cmd, false, url);
        } else {
          document.execCommand(cmd);
        }

        editor.focus();
        updatePreview();
      });
    });

    function getMediaHTML(url) {
      if (!url) return "";

      const isVideo =
        url.includes('/video/upload') ||
        url.endsWith('.mp4');

      if (isVideo) {
        return `
          <video autoplay loop muted playsinline>
            <source src="${url}" type="video/mp4">
          </video>
        `;
      }

      // GIF fallback → try forcing video pipeline
      if (url.endsWith(".gif")) {
        const videoUrl = url.replace("/image/upload/", "/video/upload/");
        return `
          <video autoplay loop muted playsinline>
            <source src="${videoUrl}" type="video/mp4">
          </video>
        `;
      }

      return `<img src="${url}" />`;
    }

    function updatePreview() {
      const text = editor.innerHTML;
      const img = currentImageUrl || "/828-brand-card.png";

      preview.innerHTML = `
        <div class="pulse-hero-preview">
          ${getMediaHTML(img)}
          <div class="pulse-overlay"></div>
          <div class="pulse-hero-text">
            ${text}
          </div>
        </div>
      `;
    }

    editor.addEventListener('input', updatePreview);

async function uploadImage(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'pulse_upload');

  // 🔥 FORCE correct type
  const isVideo = file.type.startsWith('video/');
  formData.append('resource_type', isVideo ? 'video' : 'image');

  const endpoint = isVideo
    ? 'https://api.cloudinary.com/v1_1/dz45rrije/video/upload'
    : 'https://api.cloudinary.com/v1_1/dz45rrije/image/upload';

  console.log("Uploading:", file.type);
  console.log("Endpoint:", endpoint);

  const res = await fetch(endpoint, {
    method: 'POST',
    body: formData
  });

  const data = await res.json();
  console.log("Cloudinary response:", data);

  if (!data.secure_url) {
    throw new Error("Upload failed");
  }

  return data.secure_url;
}
    publishBtn.addEventListener('click', async () => {
      const html = editor.innerHTML.trim();
      if (!html) return;

      publishBtn.disabled = true;

      try {
        let imageUrl = '';
        const file = imageInput.files[0];

        if (file) {
          statusEl.textContent = "Uploading…";
          imageUrl = await uploadImage(file);
          currentImageUrl = imageUrl;
        }

        statusEl.textContent = "Publishing…";

        await fetch('/api/tidbits/pulse-write', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: "Weather Pulse",
            text: html,
            imageUrl
          })
        });

        statusEl.textContent = "Published ✔";
        editor.innerHTML = '';
        updatePreview();

      } catch {
        statusEl.textContent = "Error";
      }

      publishBtn.disabled = false;
    });
  </script>
</body>
</html>
