<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>828 Weather Pulse Composer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        max-width: 640px;
        margin: 1.5rem auto;
        padding: 0 1rem;
      }

      h1 {
        font-size: 1.2rem;
        margin-bottom: 0.5rem;
      }

      .field {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
        color: #555;
      }

      .toolbar button {
        margin-right: 0.25rem;
      }

      #editor {
        border: 1px solid #ccc;
        border-radius: 8px;
        min-height: 140px;
        padding: 0.5rem;
      }

      #editor:focus {
        outline: 2px solid #0070f3;
        outline-offset: 2px;
      }

      .preview {
        border-top: 1px solid #eee;
        margin-top: 1rem;
        padding-top: 1rem;
        font-size: 0.9rem;
      }

      button.primary {
        background: #111827;
        color: #fff;
        border-radius: 9999px;
        border: none;
        padding: 0.5rem 1.1rem;
        cursor: pointer;
      }

      button.primary:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* HERO PREVIEW STYLES */
      .pulse-hero-preview {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .pulse-hero-preview img {
        width: 100%;
        display: block;
      }

      .pulse-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0,0,0,0.75),
          rgba(0,0,0,0.3),
          rgba(0,0,0,0)
        );
      }

      .pulse-hero-text {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0.6rem 0.7rem;
        color: white;
        font-size: 0.9rem;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <h1>828 Weather Pulse</h1>
    <p style="font-size:0.9rem;color:#555;">Quick hits. Live conditions. 828.</p>

    <div class="field">
      <label>Content</label>

      <div class="toolbar">
        <button type="button" data-cmd="bold"><b>B</b></button>
        <button type="button" data-cmd="italic"><i>I</i></button>
        <button type="button" data-cmd="createLink">Link</button>
      </div>

      <div id="editor" contenteditable="true"></div>
    </div>

    <div class="field">
      <label for="image">Image (optional)</label>
      <input type="file" id="image" accept="image/*" />
    </div>

    <div class="field">
      <button class="primary" id="publish">Publish</button>
      <span id="status" style="margin-left:0.5rem;font-size:0.85rem;"></span>
    </div>

    <div class="preview">
      <strong>Preview:</strong>
      <div id="preview-content"></div>
    </div>

    <script>
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview-content');
      const imageInput = document.getElementById('image');
      const publishBtn = document.getElementById('publish');
      const statusEl = document.getElementById('status');

      let currentImageUrl = "";

      // Toolbar
      document.querySelectorAll('.toolbar button').forEach((btn) => {
        btn.addEventListener('click', () => {
          const cmd = btn.dataset.cmd;

          if (cmd === 'createLink') {
            const url = prompt('Enter URL:');
            if (url) document.execCommand(cmd, false, url);
          } else {
            document.execCommand(cmd, false, null);
          }

          editor.focus();
          updatePreview();
        });
      });

      function updatePreview() {
        const text = editor.innerHTML;
        const img = currentImageUrl || "/828-brand-card.png";

        preview.innerHTML = `
          <div class="pulse-hero-preview">
            <img src="${img}" />
            <div class="pulse-overlay"></div>
            <div class="pulse-hero-text">
              ${text}
            </div>
          </div>
        `;
      }

      editor.addEventListener('input', updatePreview);

      // Cloudinary Upload
      async function uploadImage(file) {
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'pulse_upload');

        const res = await fetch('https://api.cloudinary.com/v1_1/dz45rrije/image/upload', {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (!data.secure_url) {
          throw new Error('Upload failed');
        }

        return data.secure_url;
      }

      // Publish
      publishBtn.addEventListener('click', async () => {
        statusEl.textContent = '';

        const html = editor.innerHTML.trim();
        if (!html) {
          statusEl.textContent = 'Add some content first.';
          return;
        }

        publishBtn.disabled = true;

        try {
          let imageUrl = '';
          const file = imageInput.files[0];

          if (file) {
            statusEl.textContent = 'Uploading image…';
            imageUrl = await uploadImage(file);
            currentImageUrl = imageUrl;
            updatePreview();
          }

          statusEl.textContent = 'Publishing…';

          const res = await fetch('/api/tidbits/pulse-write', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: "Weather Pulse",
              text: html,
              imageUrl: imageUrl || null
            }),
          });

          if (!res.ok) throw new Error('Publish failed');

          statusEl.textContent = 'Published ✔';
          editor.innerHTML = '';
          imageInput.value = '';
          currentImageUrl = '';
          updatePreview();

        } catch (e) {
          console.error(e);
          statusEl.textContent = 'Error publishing.';
        } finally {
          publishBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
