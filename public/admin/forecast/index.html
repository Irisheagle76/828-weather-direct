<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forecast Composer</title>

<style>
body {
  font-family: system-ui;
  background: #0b1220;
  color: #fff;
  margin: 0;
  display: flex;
  gap: 20px;
  padding: 20px;
}

.panel {
  flex:1;
  max-width:520px;
}

h1 {
  font-size:18px;
  margin-bottom:12px;
}

.hint {
  font-size:12px;
  opacity:.6;
  margin-bottom:14px;
}

.row { margin-bottom:12px; }

label {
  font-size:12px;
  opacity:.7;
  display:block;
  margin-bottom:4px;
}

input, textarea, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#1c2438;
  color:white;
  font-size:14px;
}

textarea { min-height:90px; }

.btn-row {
  display:flex;
  gap:8px;
  margin-top:10px;
}

button {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.primary { background:#4ade80; color:black; }
.secondary { background:#334155; color:white; }
.danger { background:#ef4444; }

.group {
  background: rgba(255,255,255,0.03);
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.05);
}

.group-title {
  font-size:12px;
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:8px;
  letter-spacing:.05em;
}

.group select,
.group input,
.group textarea {
  margin-bottom:8px;
}

.preview {
  background: linear-gradient(180deg,#1e293b,#0f172a);
  border-radius:16px;
  padding:18px;
}

.preview-headline {
  font-size:18px;
  font-weight:600;
  margin-bottom:10px;
}

.preview-narrative {
  font-size:14px;
  line-height:1.4;
}
</style>
</head>

<body>

<!-- ================= LEFT ================= -->
<div class="panel">

<h1>Forecast Composer</h1>
<div class="hint">System → Adjust Signals → Generate → Refine → Save</div>

<div class="row">
  <label for="date">Date</label>
  <input type="date" id="date">
</div>

<div class="btn-row">
  <button class="secondary" id="loadBtn">Load System</button>
  <button class="danger" id="clearBtn">Clear</button>
</div>

<!-- CONDITIONS -->
<div class="group">
  <div class="group-title">Conditions</div>

  <label for="cond-type">Dominant Type</label>
  <select id="cond-type">
    <option value="">Select</option>
    <option value="sun">Sunny</option>
    <option value="clouds">Cloudy</option>
    <option value="rain">Rain</option>
    <option value="storms">Storms</option>
    <option value="mixed">Mixed</option>
  </select>

  <label for="cond-variability">Variability</label>
  <select id="cond-variability">
    <option value="">Select</option>
    <option value="steady">Steady</option>
    <option value="changing">Changing</option>
  </select>
</div>

<!-- DRIVERS -->
<div class="group">
  <div class="group-title">Drivers</div>

  <label for="drv-temp">Temperature Trend</label>
  <select id="drv-temp">
    <option value="">Select</option>
    <option value="warming">Warming</option>
    <option value="cooling">Cooling</option>
    <option value="steady">Steady</option>
  </select>

  <label for="drv-instability">Instability</label>
  <select id="drv-instability">
    <option value="">Select</option>
    <option value="none">None</option>
    <option value="low">Low</option>
    <option value="moderate">Moderate</option>
    <option value="high">High</option>
  </select>

  <label for="drv-sky">Sky Cover</label>
  <select id="drv-sky">
    <option value="">Select</option>
    <option value="clear">Clear</option>
    <option value="partly">Partly Cloudy</option>
    <option value="cloudy">Cloudy</option>
  </select>
</div>

<!-- HAZARDS -->
<div class="group">
  <div class="group-title">Hazards</div>

  <label for="haz-storm">Storm Risk</label>
  <select id="haz-storm">
    <option value="">Select</option>
    <option value="none">None</option>
    <option value="isolated">Isolated</option>
    <option value="scattered">Scattered</option>
    <option value="numerous">Numerous</option>
  </select>

  <label for="haz-timing">Rain Timing</label>
  <select id="haz-timing">
    <option value="">Select</option>
    <option value="morning">Morning</option>
    <option value="midday">Midday</option>
    <option value="afternoon">Afternoon</option>
    <option value="evening">Evening</option>
  </select>
</div>

<!-- LOCAL -->
<div class="group">
  <div class="group-title">Local Effects (Asheville)</div>

  <label for="loc-terrain">Terrain Influence</label>
  <select id="loc-terrain">
    <option value="">Select</option>
    <option value="nw_flow">NW Flow Clouds</option>
    <option value="upslope">Upslope Clouds</option>
    <option value="none">None</option>
  </select>

  <label for="loc-fog">Fog Potential</label>
  <select id="loc-fog">
    <option value="">Select</option>
    <option value="none">None</option>
    <option value="patchy">Patchy</option>
    <option value="likely">Likely</option>
  </select>
</div>

<div class="btn-row">
  <button class="secondary" id="generateBtn">Generate Forecast</button>
</div>

<!-- OUTPUT -->
<div class="group">
  <div class="group-title">Output</div>

  <label for="headline">Headline</label>
  <input id="headline">

  <label for="narrative">Narrative</label>
  <textarea id="narrative"></textarea>

  <label for="tags">Tags</label>
  <input id="tags">

  <label for="confidence">Confidence</label>
  <input id="confidence" type="number" step="0.1">
</div>

<div class="btn-row">
  <button class="primary" id="saveBtn">Save</button>
</div>

</div>

<!-- ================= RIGHT ================= -->
<div class="panel">
<h1>Preview</h1>

<div class="preview">
  <div class="preview-headline" id="p-headline">—</div>
  <div class="preview-narrative" id="p-narrative">—</div>
</div>
</div>

<script>
const el = id => document.getElementById(id);

let data = { days:{} };

// LOAD SYSTEM
async function loadFromSystem() {
  const date = el('date').value;
  if (!date) return alert("Pick date");

  try {
    const { getSystemForecastForDate } =
      await import('/js/modules/forecast-engine.js');

    const sys = await getSystemForecastForDate(date);
    if (!sys) return alert("No data");

    const s = sys.structured || {};

    el('cond-type').value = s.conditions?.dominantType || '';
    el('cond-variability').value = s.conditions?.variability || '';

    el('drv-temp').value = s.drivers?.tempTrend || '';
    el('drv-instability').value = s.drivers?.instability || '';
    el('drv-sky').value = s.drivers?.skyCover || '';

    el('haz-storm').value = s.hazards?.stormRisk || '';
    el('haz-timing').value = s.hazards?.rainWindow || '';

    el('loc-terrain').value = s.localEffects?.terrainInfluence || '';
    el('loc-fog').value = s.localEffects?.fog || '';

    el('headline').value = sys.human?.headline || '';
    el('narrative').value = sys.human?.narrative || '';

    updatePreview();

  } catch(e){
    console.error(e);
    alert("Failed to load system forecast");
  }
}

// GENERATE
function generateForecast() {

  const f = {
    cond: el('cond-type').value,
    var: el('cond-variability').value,
    temp: el('drv-temp').value,
    inst: el('drv-instability').value,
    sky: el('drv-sky').value,
    storm: el('haz-storm').value,
    timing: el('haz-timing').value,
    terrain: el('loc-terrain').value,
    fog: el('loc-fog').value
  };

  let headline = "Quiet conditions";

  if (f.cond === "storms") headline = "Storms possible later";
  if (f.cond === "rain") headline = "Rain at times";

  const parts = [];

  parts.push(
    f.var === "changing"
      ? "Conditions evolve through the day."
      : "Conditions stay fairly steady."
  );

  if (f.temp === "warming") parts.push("Temperatures rise.");
  if (f.inst === "moderate" || f.inst === "high")
    parts.push("Instability builds supporting storms.");

  if (f.storm === "scattered")
    parts.push("Scattered storms develop.");

  if (f.timing)
    parts.push(`Most active ${f.timing}.`);

  if (f.terrain === "nw_flow")
    parts.push("NW flow keeps clouds along ridges.");

  if (f.fog === "patchy")
    parts.push("Patchy fog early.");

  el('headline').value = headline;
  el('narrative').value = parts.join(" ");

  updatePreview();
}

// SAVE
function save() {
  const d = el('date').value;
  if (!d) return;

  data.days[d] = {
    headline: el('headline').value,
    narrative: el('narrative').value
  };

  console.log("Saved:", data);
}

// CLEAR
function clearDay() {
  ['headline','narrative'].forEach(id => el(id).value = '');
  updatePreview();
}

// PREVIEW
function updatePreview() {
  el('p-headline').textContent = el('headline').value || '—';
  el('p-narrative').textContent = el('narrative').value || '—';
}

// EVENTS
el('loadBtn').onclick = loadFromSystem;
el('generateBtn').onclick = generateForecast;
el('saveBtn').onclick = save;
el('clearBtn').onclick = clearDay;

['headline','narrative'].forEach(id => {
  el(id).addEventListener('input', updatePreview);
});
</script>

</body>
</html>
