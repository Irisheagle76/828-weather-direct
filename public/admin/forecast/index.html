<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forecast Composer</title>

<style>
body {
  font-family: system-ui;
  background: #0b1220;
  color: #fff;
  margin: 0;
  display: flex;
  gap: 20px;
  padding: 20px;
}

.panel { flex:1; max-width:520px; }

h1 { font-size:18px; margin-bottom:12px; }

.hint { font-size:12px; opacity:.6; margin-bottom:14px; }

label {
  font-size:12px;
  opacity:.7;
  display:block;
  margin-bottom:4px;
}

input, textarea, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#1c2438;
  color:white;
  font-size:14px;
  margin-bottom:8px;
}

textarea { min-height:90px; }

.btn-row {
  display:flex;
  gap:8px;
  margin-top:10px;
}

button {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.primary { background:#4ade80; color:black; }
.secondary { background:#334155; }
.danger { background:#ef4444; }

.group {
  background: rgba(255,255,255,0.03);
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.05);
}

.group-title {
  font-size:12px;
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:8px;
}

/* DAY STRIP */
.day-strip {
  display:flex;
  gap:6px;
  margin-bottom:10px;
}

.day-pill {
  flex:1;
  padding:6px;
  text-align:center;
  font-size:12px;
  background:#1c2438;
  border-radius:6px;
  cursor:pointer;
  opacity:.7;
}

.day-pill.active {
  background:#4ade80;
  color:black;
  opacity:1;
}

/* PREVIEW CARD */
.card {
  background:#1e293b;
  border-radius:16px;
  padding:16px;
}

.row-top,
.row-main {
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.high { font-size:20px; font-weight:bold; }
.low { opacity:0.6; margin-left:6px; }

.fs-bar {
  height:6px;
  background:#334155;
  border-radius:4px;
  overflow:hidden;
  margin-bottom:10px;
}

.fs-fill {
  height:100%;
  background:#4ade80;
}

.takeaway {
  font-size:14px;
  line-height:1.4;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="panel">

<h1>Forecast Composer</h1>
<div class="hint">Signals → Generate → Refine</div>

<!-- DAY STRIP -->
<div class="day-strip" id="dayStrip"></div>

<label for="date">Date</label>
<input type="date" id="date">

<div id="day-context" style="margin:6px 0; font-size:13px; opacity:0.8;"></div>

<div class="btn-row">
<button class="secondary" id="loadBtn">Load System</button>
<button class="danger" id="clearBtn">Clear</button>
</div>

<!-- TEMPS -->
<div class="group">
<div class="group-title">Temperatures</div>

<label for="high">High</label>
<input id="high" type="number">

<label for="low">Low</label>
<input id="low" type="number">
</div>

<!-- WIND -->
<div class="group">
<div class="group-title">Wind</div>

<label for="wind-speed">Speed (mph)</label>
<input id="wind-speed" type="number">

<label for="wind-dir">Direction</label>
<select id="wind-dir">
<option value="">Select</option>
<option>N</option><option>NE</option><option>E</option>
<option>SE</option><option>S</option><option>SW</option>
<option>W</option><option>NW</option>
</select>
</div>

<!-- CONDITIONS -->
<div class="group">
<div class="group-title">Conditions</div>

<label for="cond-sky">Sky</label>
<select id="cond-sky">
<option value="">Select</option>
<option value="clear">Clear</option>
<option value="mostly_sunny">Mostly Sunny</option>
<option value="partly_cloudy">Partly Cloudy</option>
<option value="mostly_cloudy">Mostly Cloudy</option>
<option value="overcast">Overcast</option>
</select>

<label for="cond-evolution">Day Evolution</label>
<select id="cond-evolution">
<option value="">Select</option>
<option value="steady">Little Change</option>
<option value="building">Building Clouds</option>
<option value="clearing">Clearing Trend</option>
<option value="mixed">Back and Forth</option>
</select>
</div>

<!-- DRIVERS -->
<div class="group">
<div class="group-title">Drivers</div>

<label for="drv-temp">Temp Trend</label>
<select id="drv-temp">
<option value="">Select</option>
<option value="warming">Warming</option>
<option value="cooling">Cooling</option>
<option value="steady">Steady</option>
</select>

<label for="drv-instability">Instability</label>
<select id="drv-instability">
<option value="">Select</option>
<option value="none">None</option>
<option value="low">Low</option>
<option value="moderate">Moderate</option>
<option value="high">High</option>
</select>

<label for="drv-moisture">Moisture</label>
<select id="drv-moisture">
<option value="">Select</option>
<option value="dry">Dry</option>
<option value="moderate">Moderate</option>
<option value="humid">Humid</option>
</select>
</div>

<!-- HAZARDS -->
<div class="group">
<div class="group-title">Hazards</div>

<label for="haz-storm">Storm Risk</label>
<select id="haz-storm">
<option value="">Select</option>
<option value="none">None</option>
<option value="isolated">Isolated</option>
<option value="scattered">Scattered</option>
<option value="numerous">Numerous</option>
</select>

<label for="haz-start">Rain Start</label>
<select id="haz-start">
<option value="">Start</option>
<option value="morning">Morning</option>
<option value="midday">Midday</option>
<option value="afternoon">Afternoon</option>
<option value="evening">Evening</option>
</select>

<label for="haz-end">Rain End</label>
<select id="haz-end">
<option value="">End</option>
<option value="midday">Midday</option>
<option value="afternoon">Afternoon</option>
<option value="evening">Evening</option>
<option value="overnight">Overnight</option>
</select>
</div>

<!-- LOCAL -->
<div class="group">
<div class="group-title">Local Effects</div>

<label for="loc-terrain">Terrain</label>
<select id="loc-terrain">
<option value="">Select</option>
<option value="nw_flow">NW Flow</option>
<option value="upslope">Upslope</option>
<option value="none">None</option>
</select>

<label for="loc-fog">Fog</label>
<select id="loc-fog">
<option value="">Select</option>
<option value="none">None</option>
<option value="patchy">Patchy</option>
<option value="likely">Likely</option>
</select>
</div>

<div class="btn-row">
<button class="secondary" id="generateBtn">Generate Forecast</button>
</div>

<div class="group">
<div class="group-title">Output</div>

<label for="headline">Headline</label>
<input id="headline">

<label for="narrative">Narrative</label>
<textarea id="narrative"></textarea>
</div>

</div>

<!-- RIGHT -->
<div class="panel">

<h1>Preview</h1>

<div class="card">
<div class="row-top">
<div id="p-day">—</div>
<div>☀️</div>
</div>

<div class="row-main">
<div>
<span class="high" id="p-high">--</span>
<span class="low" id="p-low">--</span>
</div>
<div id="p-wind">—</div>
</div>

<div class="fs-bar">
<div class="fs-fill" style="width:80%"></div>
</div>

<div class="takeaway" id="p-text">—</div>
</div>

</div>

<script>
const el = id => document.getElementById(id);

/* DAY STRIP */
function initDayStrip() {
  const strip = el('dayStrip');
  const today = new Date();

  for (let i=1;i<=4;i++) {
    const d = new Date(today);
    d.setDate(today.getDate()+i);

    const label = d.toLocaleDateString(undefined,{weekday:'short'});

    const div = document.createElement('div');
    div.className = 'day-pill';
    div.textContent = i===1 ? 'Tomorrow' : label;

    div.onclick = () => {
      document.querySelectorAll('.day-pill').forEach(p=>p.classList.remove('active'));
      div.classList.add('active');
      el('date').value = d.toISOString().split('T')[0];
      updateDayContext();
    };

    if (i===1) div.classList.add('active');

    strip.appendChild(div);
  }
}

function updateDayContext() {
  const dateVal = el('date').value;
  if (!dateVal) return;

  const d = new Date(dateVal);

  el('p-day').textContent = d.toLocaleDateString(undefined,{
    weekday:'long',
    month:'short',
    day:'numeric'
  });
}

/* GENERATE */
function generateForecast() {

  let headline = "Quiet conditions";
  if (el('haz-storm').value === "scattered")
    headline = "Scattered storms possible";

  const parts = [];

  if (el('cond-evolution').value === "building")
    parts.push("Clouds increase through the day.");

  if (el('drv-instability').value === "moderate")
    parts.push("Instability supports storm development.");

  if (el('haz-start').value && el('haz-end').value)
    parts.push(`Rain develops ${el('haz-start').value} into ${el('haz-end').value}.`);

  el('headline').value = headline;
  el('narrative').value = parts.join(" ");

  updatePreview();
}

/* PREVIEW */
function updatePreview() {
  el('p-high').textContent = el('high').value || "--";
  el('p-low').textContent = el('low').value || "--";

  const wind = el('wind-speed').value;
  const dir = el('wind-dir').value;
  el('p-wind').textContent = wind ? `${dir} ${wind} mph` : "—";

  const text = el('headline').value + ". " + el('narrative').value;
  el('p-text').textContent = text;
}

/* EVENTS */
initDayStrip();

el('date').addEventListener('change', updateDayContext);

['headline','narrative','high','low','wind-speed','wind-dir']
.forEach(id => el(id).addEventListener('input', updatePreview));

el('generateBtn').onclick = generateForecast;

</script>

</body>
</html>
