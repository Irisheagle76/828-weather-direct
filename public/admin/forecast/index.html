<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forecast Composer</title>

<style>
body {
  font-family: system-ui;
  background: #0b1220;
  color: #fff;
  margin: 0;
  display: flex;
  gap: 20px;
  padding: 20px;
}

.panel { flex:1; max-width:520px; }

h1 { font-size:18px; margin-bottom:12px; }

.hint { font-size:12px; opacity:.6; margin-bottom:14px; }

label {
  font-size:12px;
  opacity:.7;
  display:block;
  margin-bottom:4px;
}

input, textarea, select {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  background:#1c2438;
  color:white;
  font-size:14px;
  margin-bottom:8px;
}

textarea { min-height:90px; }

.btn-row {
  display:flex;
  gap:8px;
  margin-top:10px;
}

button {
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

.primary { background:#4ade80; color:black; }
.secondary { background:#334155; }
.danger { background:#ef4444; }

.group {
  background: rgba(255,255,255,0.03);
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.05);
}

.group-title {
  font-size:12px;
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:8px;
}

.preview {
  background: linear-gradient(180deg,#1e293b,#0f172a);
  border-radius:16px;
  padding:18px;
}

.preview-headline {
  font-size:18px;
  font-weight:600;
  margin-bottom:10px;
}

.preview-narrative {
  font-size:14px;
  line-height:1.4;
}
</style>
</head>

<body>

<div class="panel">

<h1>Forecast Composer</h1>
<div class="hint">Signals → Generate → Refine</div>

<label for="date">Date</label>
<input type="date" id="date">

<div class="btn-row">
<button class="secondary" id="loadBtn">Load System</button>
<button class="danger" id="clearBtn">Clear</button>
</div>

<!-- CONDITIONS -->
<div class="group">
<div class="group-title">Conditions</div>

<label for="cond-sky">Sky</label>
<select id="cond-sky">
<option value="">Select</option>
<option value="clear">Clear</option>
<option value="mostly_sunny">Mostly Sunny</option>
<option value="partly_cloudy">Partly Cloudy</option>
<option value="mostly_cloudy">Mostly Cloudy</option>
<option value="overcast">Overcast</option>
</select>

<label for="cond-evolution">Day Evolution</label>
<select id="cond-evolution">
<option value="">Select</option>
<option value="steady">Little Change</option>
<option value="building">Building Clouds</option>
<option value="clearing">Clearing Trend</option>
<option value="mixed">Back and Forth</option>
</select>
</div>

<!-- DRIVERS -->
<div class="group">
<div class="group-title">Drivers</div>

<label for="drv-temp">Temperature Trend</label>
<select id="drv-temp">
<option value="">Select</option>
<option value="warming">Warming</option>
<option value="cooling">Cooling</option>
<option value="steady">Steady</option>
</select>

<label for="drv-instability">Instability</label>
<select id="drv-instability">
<option value="">Select</option>
<option value="none">None</option>
<option value="low">Low</option>
<option value="moderate">Moderate</option>
<option value="high">High</option>
</select>

<label for="drv-moisture">Moisture</label>
<select id="drv-moisture">
<option value="">Select</option>
<option value="dry">Dry</option>
<option value="moderate">Moderate</option>
<option value="humid">Humid</option>
</select>
</div>

<!-- HAZARDS -->
<div class="group">
<div class="group-title">Hazards</div>

<label for="haz-storm">Storm Risk</label>
<select id="haz-storm">
<option value="">Select</option>
<option value="none">None</option>
<option value="isolated">Isolated</option>
<option value="scattered">Scattered</option>
<option value="numerous">Numerous</option>
</select>

<label for="haz-start">Rain Start</label>
<select id="haz-start">
<option value="">Start</option>
<option value="morning">Morning</option>
<option value="midday">Midday</option>
<option value="afternoon">Afternoon</option>
<option value="evening">Evening</option>
</select>

<label for="haz-end">Rain End</label>
<select id="haz-end">
<option value="">End</option>
<option value="midday">Midday</option>
<option value="afternoon">Afternoon</option>
<option value="evening">Evening</option>
<option value="overnight">Overnight</option>
</select>
</div>

<!-- LOCAL -->
<div class="group">
<div class="group-title">Local Effects</div>

<label for="loc-terrain">Terrain</label>
<select id="loc-terrain">
<option value="">Select</option>
<option value="nw_flow">NW Flow Clouds</option>
<option value="upslope">Upslope Clouds</option>
<option value="none">None</option>
</select>

<label for="loc-fog">Fog</label>
<select id="loc-fog">
<option value="">Select</option>
<option value="none">None</option>
<option value="patchy">Patchy</option>
<option value="likely">Likely</option>
</select>
</div>

<div class="btn-row">
<button class="secondary" id="generateBtn">Generate Forecast</button>
</div>

<!-- OUTPUT -->
<div class="group">
<div class="group-title">Output</div>

<label for="headline">Headline</label>
<input id="headline">

<label for="narrative">Narrative</label>
<textarea id="narrative"></textarea>
</div>

<div class="btn-row">
<button class="primary" id="saveBtn">Save</button>
</div>

</div>

<!-- PREVIEW -->
<div class="panel">
<h1>Preview</h1>
<div class="preview">
<div class="preview-headline" id="p-headline">—</div>
<div class="preview-narrative" id="p-narrative">—</div>
</div>
</div>

<script>
const el = id => document.getElementById(id);

function generateForecast() {

  const f = {
    sky: el('cond-sky').value,
    evo: el('cond-evolution').value,
    temp: el('drv-temp').value,
    inst: el('drv-instability').value,
    moisture: el('drv-moisture').value,
    storm: el('haz-storm').value,
    start: el('haz-start').value,
    end: el('haz-end').value,
    terrain: el('loc-terrain').value,
    fog: el('loc-fog').value
  };

  // HEADLINE
  let headline = "Quiet conditions";

  if (f.storm === "scattered") headline = "Building clouds with scattered storms";
  else if (f.sky === "mostly_sunny") headline = "Mostly sunny and warm";
  else if (f.sky === "overcast") headline = "Cloudy skies dominate";

  // NARRATIVE
  const parts = [];

  // evolution
  if (f.evo === "building") parts.push("Clouds increase through the day.");
  if (f.evo === "clearing") parts.push("Clouds gradually break for more sun.");
  if (f.evo === "steady") parts.push("Conditions stay fairly steady.");

  // temp
  if (f.temp === "warming") parts.push("Temperatures rise through the day.");

  // storms
  if (f.inst === "moderate" && f.moisture === "humid")
    parts.push("Instability and moisture support storm development.");

  if (f.storm === "scattered")
    parts.push("Scattered storms develop.");

  // timing
  if (f.start && f.end)
    parts.push(`Rain develops ${f.start} and continues into the ${f.end}.`);
  else if (f.start)
    parts.push(`Rain develops in the ${f.start}.`);

  // local
  if (f.terrain === "nw_flow")
    parts.push("NW flow may hold clouds along the ridges.");

  if (f.fog === "patchy")
    parts.push("Patchy fog possible early.");

  el('headline').value = headline;
  el('narrative').value = parts.join(" ");

  updatePreview();
}

function updatePreview() {
  el('p-headline').textContent = el('headline').value || "—";
  el('p-narrative').textContent = el('narrative').value || "—";
}

el('generateBtn').onclick = generateForecast;

['headline','narrative'].forEach(id => {
  el(id).addEventListener('input', updatePreview);
});
</script>

</body>
</html>
