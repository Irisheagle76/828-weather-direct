<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>4-Day Forecast • 828 Weather</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/app-v2.css" />
</head>

<body>

<div id="forecast-root" class="page-container forecast-page"></div>

<script type="module">
import { getWeatherForUI } from '/js/adapters/weather-adapter.js';
import { calculateComfort } from '/js/intel/comfort.js';
import { generateNarrative } from '/js/intel/synthesizer/index.js';

const root = document.getElementById('forecast-root');

init();

async function init() {
  try {
    const data = await getWeatherForUI({
      lat: 35.5951,
      lon: -82.5515
    });

    const hourly = Array.isArray(data?.hourly) ? data.hourly : [];

    if (!hourly.length) {
      root.innerHTML = fallback("No forecast data available");
      return;
    }

    const cleanDays = buildCleanDays(hourly);
    const enriched = cleanDays.map(d => buildDay(d));

    // 👇 RENDER
    root.innerHTML = `
      ${renderHeader()}
      ${renderSummary(cleanDays)}
      ${enriched.map(renderDay).join("")}
    `;

    // 👇 BIND EXPAND AFTER RENDER
    bindExpand();

  } catch (err) {
    console.error("Forecast error:", err);
    root.innerHTML = fallback("Error loading forecast");
  }
}

//
// =========================
// BUILD CLEAN DAYS
// =========================
//
function buildCleanDays(hourly) {
  const now = Date.now();
  const byDay = {};

  hourly.forEach(h => {
    if (!h?.timestamp) return;

    const d = new Date(h.timestamp);
    const key = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(h);
  });

  const sorted = Object.entries(byDay)
    .map(([k, hours]) => ({ dayStart: Number(k), hours }))
    .sort((a, b) => a.dayStart - b.dayStart);

  const todayKey = new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    new Date().getDate()
  ).getTime();

  const result = [];

  const today = sorted.find(d => d.dayStart === todayKey);
  if (today) {
    const future = today.hours.filter(h => h.timestamp >= now);
    if (future.length) result.push({ ...today, hours: future });
  }

  const futureDays = sorted.filter(d => d.dayStart > todayKey);
  result.push(...futureDays.slice(0, 3));

  return result.slice(0, 4);
}

//
// =========================
// BUILD DAY
// =========================
//
function buildDay(day) {
  const hours = day.hours;

  const temps = hours.map(h => h.temperatureF).filter(Number.isFinite);

  const fs = computeDailyFS(hours);

  const narrative = generateNarrative({
    current: hours[Math.floor(hours.length / 2)],
    hourly: hours.slice(0, 8)
  });

  return {
    date: new Date(day.dayStart),
    hours,
    high: Math.round(Math.max(...temps)),
    low: Math.round(Math.min(...temps)),
    fs,
    icon: pickIcon(hours),
    takeaway: narrative?.headline || "",
    timing: narrative?.trend || ""
  };
}

//
// =========================
// FEELSCORE
// =========================
//
function computeDailyFS(hours) {
  const scores = hours.map(h => {
    const raw = calculateComfort(h)?.score ?? 5;
    return raw * 10;
  });

  if (!scores.length) return 50;

  const mid = scores.slice(
    Math.floor(scores.length * 0.3),
    Math.floor(scores.length * 0.7)
  );

  const avg =
    (mid.length ? mid : scores).reduce((a, b) => a + b, 0) /
    (mid.length || scores.length);

  return Math.round(Math.min(Math.max(avg, 0), 98));
}

//
// =========================
// RENDER
// =========================
//
function renderHeader() {
  return `
    <div class="section-header">
      <h1>4-Day Forecast</h1>
      <p class="subtitle">Quick look ahead</p>
    </div>
  `;
}

function renderSummary(days) {
  const allHours = days.flatMap(d => d.hours);

  const narrative = generateNarrative({
    current: allHours[0],
    hourly: allHours.slice(0, 12)
  });

  return `
    <div class="card forecast-summary">
      <div class="summary-line">${narrative?.headline || "Conditions evolving"}</div>
      <div class="summary-meta">${narrative?.trend || ""}</div>
    </div>
  `;
}

function renderDay(d) {
  return `
    <div class="card forecast-row expandable">

      <div class="row-top">
        <div class="day">${formatDay(d.date)}</div>
        <div class="icon">${d.icon}</div>
      </div>

      <div class="row-main">
        <div class="temps">
          <span class="high">${d.high}°</span>
          <span class="low">${d.low}°</span>
        </div>

        <div class="feelscore">
          <span class="fs-value">${d.fs}</span>
          <span class="fs-label">${mapLabel(d.fs)}</span>
        </div>
      </div>

      <div class="fs-bar">
        <div class="fs-fill" style="width:${d.fs}%"></div>
      </div>

      <div class="row-bottom">
        <div class="takeaway">${d.takeaway}</div>
        <div class="timing">${d.timing}</div>
      </div>

      <div class="expand-content">
        ${renderExpanded(d)}
      </div>

    </div>
  `;
}

//
// =========================
// EXPANDED CONTENT
// =========================
//
function renderExpanded(d) {
  const slice = d.hours.slice(0, 8);

  return `
    <div class="expanded-inner">
      <div class="hourly-strip">
        ${slice.map(renderHour).join("")}
      </div>
    </div>
  `;
}

function renderHour(h) {
  const hour = new Date(h.timestamp).getHours();

  return `
    <div class="hour">
      <div class="hour-time">${formatHour(hour)}</div>
      <div class="hour-temp">${Math.round(h.temperatureF)}°</div>
    </div>
  `;
}

//
// =========================
// INTERACTION (EXPAND)
// =========================
//
function bindExpand() {
  const cards = document.querySelectorAll('.forecast-row.expandable');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const isOpen = card.classList.contains('open');

      cards.forEach(c => c.classList.remove('open'));

      if (!isOpen) {
        card.classList.add('open');
      }
    });
  });
}

//
// =========================
// HELPERS
// =========================
//
function pickIcon(hours) {
  const rain = hours.some(h => (h.precipProbability ?? 0) > 0.5);
  return rain ? "🌧️" : "☀️";
}

function mapLabel(fs) {
  if (fs >= 90) return "Ideal";
  if (fs >= 75) return "Excellent";
  if (fs >= 60) return "Comfortable";
  if (fs >= 45) return "Unsettled";
  return "Harsh";
}

function formatDay(date) {
  return date.toLocaleDateString([], { weekday: "long" }).toUpperCase();
}

function formatHour(h) {
  if (h === 0) return "12a";
  if (h < 12) return `${h}a`;
  if (h === 12) return "12p";
  return `${h - 12}p`;
}

function fallback(msg) {
  return `<div style="padding:20px;">${msg}</div>`;
}
</script>

</body>
</html>
