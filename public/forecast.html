<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>4-Day Forecast • 828 Weather</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/app-v2.css" />
</head>

<body>

<div id="forecast-root" class="page-container forecast-page"></div>

<script type="module">
import { getWeatherForUI } from '/js/adapters/weather-adapter.js';
import { calculateComfort } from '/js/intel/comfort.js';
import { generateNarrative } from '/js/intel/synthesizer/index.js';

const root = document.getElementById('forecast-root');

init();

async function init() {
  try {
    const data = await getWeatherForUI({
      lat: 35.5951,
      lon: -82.5515
    });

    const hourly = Array.isArray(data?.hourly) ? data.hourly : [];

    console.log("==== TIMEZONE CHECK ====");
    console.log("Browser TZ:", Intl.DateTimeFormat().resolvedOptions().timeZone);

    console.log("==== RAW HOURLY SAMPLE ====");
    hourly.slice(0, 5).forEach(h => {
      console.log({
        raw: h.timestamp,
        local: new Date(h.timestamp).toString(),
        iso: new Date(h.timestamp).toISOString()
      });
    });

    if (!hourly.length) {
      root.innerHTML = fallback("No forecast data available");
      return;
    }

    const days = buildCleanDays(hourly);

    console.log("==== FINAL FORECAST DAYS ====");
    days.forEach((d, i) => {
      console.log(
        `Day ${i + 1}`,
        new Date(d.dayStart).toDateString(),
        "| hours:", d.hours.length
      );
    });

    const enriched = days.map(buildDay);

    root.innerHTML = `
      ${renderHeader()}
      ${renderSummary(enriched)}
      ${enriched.map(renderDay).join("")}
    `;

    bindExpand();

  } catch (err) {
    console.error("Forecast error:", err);
    root.innerHTML = fallback("Error loading forecast");
  }
}

//
// =========================
// FORCE 4 DAYS
// =========================
//
function buildCleanDays(hourly) {
  const byDay = {};

  hourly.forEach(h => {
    if (!h?.timestamp) return;

    const d = new Date(h.timestamp);
    const key = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

    if (!byDay[key]) byDay[key] = [];
    byDay[key].push(h);
  });

  console.log("==== DAY GROUPING ====");
  Object.entries(byDay).forEach(([key, hours]) => {
    console.log(
      new Date(Number(key)).toDateString(),
      "| hours:", hours.length,
      "| first:", new Date(hours[0]?.timestamp).toString(),
      "| last:", new Date(hours[hours.length - 1]?.timestamp).toString()
    );
  });

  const today = new Date();
  today.setHours(0,0,0,0);

  const days = [];

  for (let i = 1; i <= 4; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);

    const key = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();

    days.push({
      dayStart: key,
      hours: byDay[key] || []
    });
  }

  return days;
}

//
// =========================
// BUILD DAY
// =========================
//
function buildDay(day) {
  const hours = day.hours;

  console.log("==== BUILD DAY ====");
  console.log({
    label: new Date(day.dayStart).toDateString(),
    hours: hours.length,
    firstHour: hours[0] ? new Date(hours[0].timestamp).toString() : null,
    lastHour: hours.length
      ? new Date(hours[hours.length - 1].timestamp).toString()
      : null
  });

  const temps = hours.map(h => h.temperatureF).filter(Number.isFinite);
  const fs = computeDailyFS(hours);

  const narrative = generateNarrative({
    current: hours[0] || null,
    hourly: hours,
    span: "day"
  });

  const isHourlyRich = hours.length >= 12;
  const dayParts = buildDayParts(hours);

  return {
    date: new Date(day.dayStart),
    hours,
    fs,
    isHourlyRich,
    dayParts,
    high: temps.length ? Math.round(Math.max(...temps)) : "--",
    low: temps.length ? Math.round(Math.min(...temps)) : "--",
    icon: pickIcon(hours),

    takeaway:
      narrative?.headline ||
      narrative?.narrative ||
      (fs >= 75 ? "Comfortable overall" : "Some variability expected"),

    timing: narrative?.trend || ""
  };
}

//
// =========================
// DAY PARTS
// =========================
//
function buildDayParts(hours) {
  if (!hours.length) return null;

  const parts = {
    morning: hours.filter(h => hour(h) >= 6 && hour(h) < 12),
    afternoon: hours.filter(h => hour(h) >= 12 && hour(h) < 18),
    evening: hours.filter(h => hour(h) >= 18 && hour(h) < 24),
  };

  return {
    morning: summarize(parts.morning),
    afternoon: summarize(parts.afternoon),
    evening: summarize(parts.evening)
  };
}

function summarize(part) {
  if (!part.length) return null;

  return {
    temp: avg(part, "temperatureF"),
    rain: Math.max(...part.map(h => h.precipProbability || 0)),
    cloud: avg(part, "cloudCover")
  };
}

function hour(h) {
  return new Date(h.timestamp).getHours();
}

//
// =========================
// FEELSCORE
// =========================
//
function computeDailyFS(hours) {
  if (!hours.length) return 50;

  const scores = hours.map(h => {
    const raw = calculateComfort(h)?.score ?? 5;
    return raw * 10;
  });

  return Math.round(
    scores.reduce((a, b) => a + b, 0) / scores.length
  );
}

//
// =========================
// RENDER
// =========================
//
function renderHeader() {
  return `
    <div class="section-header">
      <h1>4-Day Forecast</h1>
      <p class="subtitle">Quick look ahead</p>
    </div>
  `;
}

function renderSummary(days) {
  const best = days.reduce((a, b) => (b.fs > a.fs ? b : a), days[0]);

  return `
    <div class="card forecast-summary">
      <div class="summary-line">
        Best conditions: ${formatDay(best.date)}
      </div>
      <div class="summary-meta">
        Comfort peaks early → slight changes later
      </div>
    </div>
  `;
}

function renderDay(d) {
  return `
    <div class="card forecast-row expandable">
      <div class="row-top">
        <div class="day">${formatDay(d.date)}</div>
        <div class="icon">${d.icon}</div>
      </div>

      <div class="row-main">
        <div class="temps">
          <span class="high">${d.high}°</span>
          <span class="low">${d.low}°</span>
        </div>

        <div class="feelscore">
          <span class="fs-value">${d.fs}</span>
          <span class="fs-label">${mapLabel(d.fs)}</span>
        </div>
      </div>

      <div class="fs-bar">
        <div class="fs-fill" style="width:${d.fs}%"></div>
      </div>

      <div class="row-bottom">
        <div class="takeaway">${d.takeaway}</div>
        <div class="timing">${d.timing}</div>
      </div>

      <div class="expand-content">
        ${renderExpanded(d)}
      </div>
    </div>
  `;
}

function renderExpanded(d) {
  if (d.isHourlyRich) {
    const slice = d.hours.slice(4, 16);

    return `
      <div class="expanded-inner">
        <div class="hourly-strip">
          ${slice.map(renderHour).join("")}
        </div>
      </div>
    `;
  }

  if (d.dayParts) {
    return `
      <div class="expanded-inner">
        ${renderPart("Morning", d.dayParts.morning)}
        ${renderPart("Afternoon", d.dayParts.afternoon)}
        ${renderPart("Evening", d.dayParts.evening)}
      </div>
    `;
  }

  return "";
}

function renderHour(h) {
  const hNum = hour(h);
  const level = getPrecipLevel(h.precipProbability || 0);

  return `
    <div class="hour">
      <div class="hour-time">${formatHour(hNum)}</div>
      <div class="hour-temp">${Math.round(h.temperatureF)}°</div>
      <div class="precip-bar">
        <div class="precip-fill level-${level}"></div>
      </div>
    </div>
  `;
}

function renderPart(label, part) {
  if (!part) return "";

  const icon =
    part.rain > 0.6 ? "🌧️" :
    part.cloud > 0.6 ? "⛅" :
    "☀️";

  return `
    <div class="expanded-row">
      <div>${label}</div>
      <div>${icon} ${Math.round(part.temp)}°</div>
    </div>
  `;
}

//
// =========================
// HELPERS
// =========================
//
function getPrecipLevel(p) {
  if (p > 0.7) return 5;
  if (p > 0.5) return 4;
  if (p > 0.3) return 3;
  if (p > 0.15) return 2;
  if (p > 0.05) return 1;
  return 0;
}

function pickIcon(hours) {
  if (!hours.length) return "—";

  const peak = Math.max(...hours.map(h => h.precipProbability || 0));

  if (peak > 0.7) return "🌧️";
  if (peak > 0.4) return "🌦️";

  const cloud =
    hours.reduce((sum, h) => sum + (h.cloudCover || 0), 0) / hours.length;

  if (cloud > 0.6) return "⛅";

  return "☀️";
}

function avg(arr, key) {
  const vals = arr.map(h => h[key]).filter(Number.isFinite);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}

function mapLabel(fs) {
  if (fs >= 90) return "Ideal";
  if (fs >= 75) return "Excellent";
  if (fs >= 60) return "Comfortable";
  if (fs >= 45) return "Unsettled";
  return "Harsh";
}

function formatDay(date) {
  const tomorrow = new Date();
  tomorrow.setDate(new Date().getDate() + 1);

  if (date.toDateString() === tomorrow.toDateString()) {
    return "TOMORROW";
  }

  return date.toLocaleDateString([], { weekday: "long" }).toUpperCase();
}

function formatHour(h) {
  if (h === 0) return "12a";
  if (h < 12) return `${h}a`;
  if (h === 12) return "12p";
  return `${h - 12}p`;
}

function fallback(msg) {
  return `<div style="padding:20px;">${msg}</div>`;

  function bindExpand() {
  const cards = document.querySelectorAll('.forecast-row.expandable');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const isOpen = card.classList.contains('open');

      // close all
      cards.forEach(c => c.classList.remove('open'));

      // reopen clicked one
      if (!isOpen) {
        card.classList.add('open');
      }
    });
  });
}

}
</script>

</body>
</html>
