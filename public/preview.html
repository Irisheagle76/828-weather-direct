<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AVL Weather – Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/app-v2.css" />
</head>

<body>

  <!-- PREVIEW LABEL -->
  <div style="
    text-align:center;
    padding:6px;
    font-size:12px;
    letter-spacing:1px;
    opacity:.6;
  ">
    PREVIEW MODE
  </div>

  <!-- =====================================
       HEADER (NEW V2)
       ===================================== -->
  <div class="app-header">
    <div class="header-inner">

      <div class="brand">
        <div class="brand-title">828 Weather Direct</div>
        <div class="brand-sub">Hyper-local Asheville forecast</div>
      </div>

      <div class="live-row" id="wx-metrics">
        <div class="live-chip">LIVE</div>
        <div id="updated-time" class="updated-time">Updated just now</div>

        <!-- placeholder chips -->
        <div class="metric-chip">🌡 67°</div>
        <div class="metric-chip">💧 52°</div>
        <div class="metric-chip">💦 59%</div>
        <div class="metric-chip">💨 1 mph</div>
      </div>

    </div>
  </div>

  <!-- APP ROOT -->
  <div id="app"></div>

  <!-- =====================================
       INFO MODAL
       ===================================== -->
  <div id="info-modal" class="info-modal hidden" onclick="closeInfo(event)">
    <div class="info-content" onclick="event.stopPropagation()">
      <div class="info-close" onclick="closeInfo()">✕</div>
      <div id="info-body"></div>
    </div>
  </div>

  <!-- =====================================
       SCRIPT
       ===================================== -->
  <script type="module">
    import { renderNewLayout } from '/js/new-layout.js';

    const app = document.getElementById('app');
    await renderNewLayout(app);

    // ============================================================
    // INFO MODAL LOGIC
    // ============================================================

    window.openInfo = function(type, value = null) {
      const modal = document.getElementById('info-modal');
      const body = document.getElementById('info-body');

      if (type === 'feelscore') {

        const currentLine = value != null
          ? `<p style="margin-top:10px;"><b>You are here:</b> ${value}</p>`
          : '';

        body.innerHTML = `
          <h2>FeelScore</h2>

          <p>
            Measures how the air actually feels using temperature,
            humidity (dew point), and wind.
          </p>

          <h3>Scale (0–100)</h3>
          <ul>
            <li><b>90–100</b> → Ideal</li>
            <li><b>70–89</b> → Comfortable</li>
            <li><b>55–69</b> → Slight discomfort</li>
            <li><b>40–54</b> → Uncomfortable</li>
            <li><b><40</b> → Harsh</li>
          </ul>

          ${currentLine}
        `;
      }

      if (type === 'drought') {
        body.innerHTML = `
          <h2>Drought & Fire Index</h2>

          <p>
            Combines long-term dryness with daily fire weather risk.
          </p>

          <h3>DSS (Drought Stress)</h3>
          <ul>
            <li>0–25 → Normal</li>
            <li>25–45 → Dry</li>
            <li>45–65 → Moderate</li>
            <li>65–85 → Severe</li>
            <li>85+ → Extreme</li>
          </ul>

          <h3>FRI (Fire Risk)</h3>
          <ul>
            <li>0–30 → Low</li>
            <li>30–50 → Elevated</li>
            <li>50–70 → High</li>
            <li>70–85 → Very high</li>
            <li>85+ → Extreme</li>
          </ul>

          <p style="margin-top:10px;">
            Official drought levels (D0–D4) reflect longer-term conditions.
          </p>
        `;
      }

      modal.classList.remove('hidden');
    };

    window.closeInfo = function(e) {
      // allow click outside modal to close
      if (!e || e.target.id === 'info-modal') {
        document.getElementById('info-modal').classList.add('hidden');
      }
    };
  </script>

</body>
</html>
