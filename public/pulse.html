<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>828 Weather Pulse Archive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/app-v2.css?v=20260509-tempcompact" />
  <style>
    .pulse-archive {
      max-width: 660px;
      margin: 0 auto;
      padding: 14px 12px 48px;
    }

    .pulse-archive-header {
      margin: 8px 0 14px;
    }

    .pulse-archive-back {
      color: #9ecbff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .pulse-archive-title {
      margin: 10px 0 4px;
      color: #f4f8ff;
      font-size: 24px;
      line-height: 1.1;
    }

    .pulse-archive-subtitle {
      color: rgba(207, 226, 255, 0.72);
      font-size: 13px;
    }

    .pulse-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pulse-feed-item {
      scroll-margin-top: 14px;
    }

    .pulse-feed-meta {
      color: rgba(207, 226, 255, 0.68);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .pulse-feed-media {
      overflow: hidden;
      border-radius: 12px;
      margin-bottom: 10px;
      background: rgba(255,255,255,0.05);
    }

    .pulse-feed-media img,
    .pulse-feed-media video {
      width: 100%;
      max-height: 440px;
      display: block;
      object-fit: cover;
    }

    .pulse-feed-text {
      color: rgba(255,255,255,0.9);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .pulse-feed-text p {
      margin: 0 0 0.75em;
    }

    .pulse-feed-text p:last-child {
      margin-bottom: 0;
    }

    .pulse-feed-text ul,
    .pulse-feed-text ol {
      margin: 0.45em 0 0.75em 1.25em;
      padding: 0;
    }

    .pulse-feed-text a {
      color: #9ecbff;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
  </style>
  <link rel="stylesheet" href="/css/brand-lockup.css?v=20260805-brand2" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="forecast-header-row">
        <a class="brand site-brand-lockup" href="/" aria-label="828 Weather Direct home">
          <div class="brand-title site-brand-title"><span class="site-brand-828">828</span> Weather Direct</div>
          <div class="brand-sub site-brand-sub">Hyper-local Asheville forecast built by Tim Ballisty</div>
        </a>
        <nav class="forecast-nav" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/forecast.html">Forecast</a>
          <a href="/hiking.html">Hiking</a>
          <a href="/water.html">Water Conditions</a>
          <a href="/i26-connector.html">I-26 Connector</a>
          <a class="active" href="/pulse.html" aria-current="page">Weather Pulse</a>
          <a href="/828-sunset-radiance.html">Sunset Radiance</a>
        </nav>
      </div>
    </div>
  </header>
  <main class="pulse-archive">
    <header class="pulse-archive-header">
      <a class="pulse-archive-back" href="/">Back to 828 Weather Direct</a>
      <h1 class="pulse-archive-title">828 Weather Pulse</h1>
      <div class="pulse-archive-subtitle">Recent quick hits, newest first.</div>
    </header>

    <section class="pulse-feed" id="pulse-feed">
      <div class="content-card">Loading Pulse updates...</div>
    </section>
  </main>

  <script type="module">
    const feed = document.getElementById("pulse-feed");

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function sanitizePulseHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html || "";

      const allowedTags = new Set(["A", "B", "BR", "CODE", "EM", "I", "LI", "OL", "P", "STRONG", "U", "UL"]);
      const allowedProtocols = new Set(["http:", "https:", "mailto:", "tel:"]);

      function cleanNode(node) {
        for (const child of Array.from(node.childNodes)) {
          if (child.nodeType === Node.TEXT_NODE) continue;

          if (child.nodeType !== Node.ELEMENT_NODE || !allowedTags.has(child.tagName)) {
            cleanNode(child);
            child.replaceWith(...Array.from(child.childNodes));
            continue;
          }

          const rawHref = child.tagName === "A" ? child.getAttribute("href") || "" : "";

          for (const attr of Array.from(child.attributes)) {
            child.removeAttribute(attr.name);
          }

          if (child.tagName === "A") {
            let href = "";

            try {
              const url = new URL(rawHref, window.location.origin);
              if (allowedProtocols.has(url.protocol)) href = url.href;
            } catch {
              href = "";
            }

            if (href) {
              child.setAttribute("href", href);
              child.setAttribute("target", "_blank");
              child.setAttribute("rel", "noopener noreferrer");
            } else {
              child.replaceWith(...Array.from(child.childNodes));
              continue;
            }
          }

          cleanNode(child);
        }
      }

      cleanNode(template.content);
      return template.innerHTML.trim();
    }

    function formatDate(timestamp) {
      if (!timestamp) return "Recent";
      return new Date(timestamp).toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function mediaHtml(item) {
      const media = item.mediaUrl || item.image;
      if (!media) return "";
      const safeMedia = escapeHTML(media);
      const isVideo = item.mediaType === "video" || media.endsWith(".mp4") || media.includes("/video/");

      return `
        <div class="pulse-feed-media">
          ${
            isVideo
              ? `<video controls playsinline preload="metadata"><source src="${safeMedia}" type="video/mp4" /></video>`
              : `<img src="${safeMedia}" alt="" loading="lazy" />`
          }
        </div>
      `;
    }

    function render(items) {
      if (!items.length) {
        feed.innerHTML = '<div class="content-card">No Pulse updates have been published yet.</div>';
        return;
      }

      feed.innerHTML = items.map((item) => `
        <article class="content-card pulse-feed-item" id="pulse-${escapeHTML(item.timestamp || "")}">
          <div class="pulse-feed-meta">${escapeHTML(formatDate(item.timestamp))}</div>
          ${mediaHtml(item)}
          <div class="pulse-feed-text">${sanitizePulseHtml(item.text || item.body || item.content || "")}</div>
        </article>
      `).join("");

      if (window.location.hash) {
        document.querySelector(window.location.hash)?.scrollIntoView();
      }
    }

    try {
      const response = await fetch("/api/router?route=tidbits/pulse-feed");
      const data = await response.json();
      render(Array.isArray(data.items) ? data.items : []);
    } catch {
      feed.innerHTML = '<div class="content-card">Unable to load Pulse updates right now.</div>';
    }
  </script>
</body>
</html>
