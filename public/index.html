<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>828 Weather Direct – WU Powered</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ============================================================
     ROOT VARIABLES
    ============================================================ */
    :root {
      --card-padding: 1.5rem;
      --module-padding: 1rem 1.2rem;
      --module-radius: 22px;
      --gap: 1.4rem;
    }

    @media (max-height: 700px),
    (max-width: 420px) {
      :root {
        --card-padding: 1rem;
        --module-padding: 0.85rem 1rem;
        --module-radius: 18px;
        --gap: 1rem;
      }
    }

    /* ============================================================
     GLOBAL ELEMENTS
    ============================================================ */
    body {
      background: #0a0f1c;
      color: #f5f5f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: var(--card-padding);
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.03em;
      margin: 0 0 0.4rem;
    }

    .subtitle {
      color: #9aa3c2;
      font-size: 0.9rem;
      margin-bottom: var(--gap);
    }

    /* ============================================================
     CARD WRAPPER
    ============================================================ */
    .card {
      background: #141a2a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: var(--module-radius);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      margin: 0 auto;
      max-width: 720px;
      padding: var(--card-padding);
    }

    /* ============================================================
     STATUS BLOCK
    ============================================================ */
    .status-row {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: var(--gap);
    }

    .badge {
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      display: inline-flex;
      font-size: 0.78rem;
      gap: 0.4rem;
      letter-spacing: 0.08em;
      padding: 0.3rem 0.7rem;
      text-transform: uppercase;
    }

    .badge-dot {
      background: #f5c84c;
      border-radius: 999px;
      height: 8px;
      width: 8px;
    }

    .badge-dot.ok { background: #ffa94d; }
    .badge-dot.error { background: #fb7185; }

    .status-text {
      color: #c4c9e5;
      font-size: 0.85rem;
    }

    /* ============================================================
     METRICS GRID
    ============================================================ */
    .metrics-row { margin-bottom: var(--gap); }

    .grid {
      display: grid;
      gap: var(--gap);
      grid-template-columns: repeat(4, 1fr);
    }

    .metric {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 70px;
      padding: 0.45rem 0.6rem;
    }

    .metric-label {
      color: #f0b777;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      margin-bottom: 0.15rem;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .metric-sub {
      color: #9aa3c2;
      font-size: 0.68rem;
      margin-top: 0.1rem;
    }

    /* ============================================================
     (ALL OTHER MODULE CSS REMAINS UNCHANGED)
    ============================================================ */

    /* ============================================================
     828 WEATHER PULSE MODULE (FINAL CLEAN)
    ============================================================ */

    .pulse-module {
      margin: var(--gap) auto 0;
      max-width: 640px;
    }

    .pulse-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--module-radius);
      padding: 0.9rem 1.1rem 0.7rem;
      box-shadow: 0 10px 26px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .pulse-header { margin-bottom: 0.4rem; }

    .pulse-title {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8fb7ff;
    }

    .pulse-badge-pill {
      margin-top: 0.25rem;
      padding: 2px 10px;
      border-radius: 9999px;
      background: rgba(255,169,77,0.16);
      border: 1px solid rgba(255,169,77,0.55);
      font-size: 0.72rem;
      color: #ffa94d;
    }

    .pulse-timestamp {
      margin-top: 0.25rem;
      font-size: 0.8rem;
      color: #b9c7f5;
    }

    .pulse-body {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    .pulse-thumb {
      flex: 0 0 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      background: #1f2435;
    }

    .pulse-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pulse-preview {
      flex: 1;
      font-size: 0.86rem;
      color: #d8dff7;
      line-height: 1.4;
    }

    .pulse-toggle {
      margin-top: 0.55rem;
      border: none;
      background: none;
      color: #8fb7ff;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .pulse-hero {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .pulse-hero img {
      width: 100%;
      display: block;
    }

    .pulse-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
      pointer-events: none;
    }

    .pulse-hero-text {
      position: absolute;
      bottom: 0;
      padding: 0.6rem;
      color: white;
      font-size: 0.85rem;
      max-height: 60%;
      overflow: hidden;
    }

    .pulse-expanded-img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 0.6rem;
    }

    .pulse-full-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e5e7eb;
    }

  </style>
</head>

<body>

  <!-- YOUR ORIGINAL BODY CONTENT (UNCHANGED) -->
  <!-- (metrics, comfort, outlook, pulse module, substack, footer all remain exactly as-is) -->

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/substack-render.js"></script>
  <script type="module" src="/js/pulse-render.js"></script>

</body>

</html>
