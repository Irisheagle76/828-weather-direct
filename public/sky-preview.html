<!-- @ts-nocheck -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>828 Sky Update (Preview)</title>

  <style>
:root {
  --bg: #0f1115;
  --card: #171a21;
  --border: #2a2f3a;
  --text: #e6e8ee;
  --muted: #9aa3b2;
  --accent: #6ea8ff;
  --fog: #8a8f98;
  --cloud: #7aa2ff;
  --clear: #4fd1c5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 18px;
}

h1 {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 4px;
}

.sub {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 18px;
}

/* --- HERO --- */
.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.hero img {
  width: 100%;
  display: block;
}

.hero-body {
  padding: 20px;
}

/* --- CONDITION CHIP --- */
.chip {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  margin-bottom: 12px;
  font-weight: 500;
}

.chip.fog { background: var(--fog); color: white; }
.chip.cloud { background: var(--cloud); color: white; }
.chip.clear { background: var(--clear); color: #002; }

/* --- TEXT --- */
.headline {
  font-size: 28px;
  line-height: 1.2;
  font-weight: 600;
  margin-bottom: 8px;
}

.detail {
  font-size: 18px;
  line-height: 1.4;
  color: var(--muted);
  margin-bottom: 16px;
}

/* --- CONFIDENCE --- */
.confidence {
  height: 8px;
  background: #222;
  border-radius: 999px;
  overflow: hidden;
}

.confidence-bar {
  height: 100%;
  background: linear-gradient(90deg, #6ea8ff, #4fd1c5);
  width: 0%;
  transition: width 0.6s ease;
}

/* --- DEBUG --- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.card h3 {
  margin: 0 0 8px 0;
  font-size: 13px;
  color: var(--muted);
}

pre {
  font-size: 12px;
  white-space: pre-wrap;
}

  </style>
</head>

<body>
<div class="wrap">

  <h1>🌤 828 Sky Update</h1>
  <div class="sub" id="lastUpdate">Loading…</div>

  <!-- HERO -->
  <div class="hero">
    <img id="skyImage" src="./js/sky-cam/frame.jpg" />

    <div class="hero-body">
      <div id="chip" class="chip">Loading</div>
      <div id="headline" class="headline">—</div>
      <div id="conditionLabel" style="font-size:12px;color:#9aa3b2;margin-bottom:6px;"></div>
      <div id="detail" class="detail">—</div>

      <div class="confidence">
        <div id="confidenceBar" class="confidence-bar"></div>
      </div>
    </div>
  </div>

  <!-- DEBUG -->
  <div class="card">
    <h3>📷 Camera Data</h3>
    <pre id="metrics">Loading...</pre>
  </div>

  <div class="card">
    <h3>🧠 Sky Intel</h3>
    <pre id="intel">Loading...</pre>
  </div>

  <div class="card">
    <h3>🗣 Narrative</h3>
    <pre id="narrative">Loading...</pre>
  </div>

</div>

<script type="module">

import { computeSkyIntel } from "./js/intel/sky-intel.js";
import { generateSkyNarrative } from "./js/intel/sky-narrative.js";

// memory for smoothing
window.prev1 = window.prev1 || null;
window.prev2 = window.prev2 || null;

function getChipClass(type) {
  if (type === "fog") return "chip fog";
  if (type === "cloud") return "chip cloud";
  if (type === "clear") return "chip clear";
  return "chip";
}

async function run() {
  try {
    const res = await fetch(`./js/sky-cam/output.json?t=${Date.now()}`);
    const cameraData = await res.json();

    const skyIntel = computeSkyIntel({
      camera: {
        ...cameraData,
        previous: window.prev1,
        previous2: window.prev2
      }
    });

    const narrative = generateSkyNarrative(cameraData, skyIntel);

    // -------------------------
    // HERO TEXT
    // -------------------------
    document.getElementById("headline").textContent = narrative.headline;
    document.getElementById("detail").textContent = narrative.detail;

    // -------------------------
    // CONDITION LABEL
    // -------------------------
    document.getElementById("conditionLabel").textContent =
      skyIntel.atmosphericState.replace("_", " ");

    // -------------------------
    // CHIP (clean mapping)
    // -------------------------
    const chip = document.getElementById("chip");

    const chipType =
      skyIntel.atmosphericState === "fog" ? "fog" :
      skyIntel.atmosphericState.includes("cloud") ? "cloud" :
      "clear";

    chip.textContent = skyIntel.atmosphericState.replace("_", " ");
    chip.className = getChipClass(chipType);

    // -------------------------
    // CONFIDENCE BAR (FIXED)
    // -------------------------
    const conf = Math.round((skyIntel.confidence || 0) * 100);
    document.getElementById("confidenceBar").style.width = conf + "%";

    // -------------------------
    // IMAGE REFRESH
    // -------------------------
    document.getElementById("skyImage").src =
      `./js/sky-cam/frame.jpg?t=${Date.now()}`;

    // -------------------------
    // DEBUG PANELS
    // -------------------------
    document.getElementById("metrics").textContent =
      JSON.stringify(cameraData, null, 2);

    document.getElementById("intel").textContent =
      JSON.stringify(skyIntel, null, 2);

    document.getElementById("narrative").textContent =
      JSON.stringify(narrative, null, 2);

    // -------------------------
    // TIMESTAMP
    // -------------------------
    document.getElementById("lastUpdate").textContent =
      "Last update: " + new Date().toLocaleTimeString();

    // -------------------------
    // MEMORY
    // -------------------------
    window.prev2 = window.prev1;
    window.prev1 = cameraData;

  } catch (err) {
    document.getElementById("headline").textContent = "Error loading data";
    console.error(err);
  }
}

// loop
async function loop() {
  await run();
  setTimeout(loop, 5000);
}

loop();

</script>
</body>
</html>
