<!-- @ts-nocheck -->
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>828 Sky Update</title>

<style>
:root {
  --bg: #0f1115;
  --card: #171a21;
  --border: #2a2f3a;
  --text: #e6e8ee;
  --muted: #9aa3b2;
  --accent: #6ea8ff;
  --fog: #8a8f98;
  --cloud: #7aa2ff;
  --clear: #4fd1c5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 18px;
}

h1 {
  font-size: 28px;
  margin-bottom: 4px;
}

.sub {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 18px;
}

/* HERO */
.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.hero img {
  width: 100%;
  display: block;
}

.hero-body {
  padding: 20px;
}

.chip {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 13px;
  margin-bottom: 12px;
  font-weight: 500;
}

.chip.fog { background: var(--fog); color: #fff; }
.chip.cloud { background: var(--cloud); color: #fff; }
.chip.clear { background: var(--clear); color: #002; }

.headline {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 6px;
}

.detail {
  font-size: 18px;
  color: var(--muted);
  margin-bottom: 14px;
}

.condition {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.confidence {
  height: 8px;
  background: #222;
  border-radius: 999px;
  overflow: hidden;
}

.confidence-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#6ea8ff,#4fd1c5);
  transition: width 0.6s ease;
}

/* DEBUG */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.card h3 {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

pre {
  font-size: 12px;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<div class="wrap">

<h1>🌤 828 Sky Update</h1>
<div class="sub" id="lastUpdate">Loading…</div>

<div class="hero">
  <img id="skyImage" src="./js/sky-cam/frame.jpg">

  <div class="hero-body">
    <div id="chip" class="chip">Loading</div>
    <div id="headline" class="headline">—</div>
    <div id="conditionLabel" class="condition"></div>
    <div id="detail" class="detail">—</div>

    <div class="confidence">
      <div id="confidenceBar" class="confidence-bar"></div>
    </div>
  </div>
</div>

<div class="card">
  <h3>📷 Camera Data</h3>
  <pre id="metrics"></pre>
</div>

<div class="card">
  <h3>🧠 Sky Intel</h3>
  <pre id="intel"></pre>
</div>

<div class="card">
  <h3>🗣 Narrative</h3>
  <pre id="narrative"></pre>
</div>

</div>

<script type="module">

import { computeSkyIntel } from "./js/intel/sky-intel.js";
import { generateSkyNarrative } from "./js/intel/sky-narrative.js";

let prev1 = null;
let prev2 = null;

function mapChip(state) {
  if (state === "fog") return "fog";
  if (state.includes("cloud")) return "cloud";
  return "clear";
}

async function run() {
  try {
    const res = await fetch(`./js/sky-cam/output.json?t=${Date.now()}`);
    const data = await res.json();

    const skyIntel = computeSkyIntel({
      camera: {
        ...data,
        previous: prev1,
        previous2: prev2
      }
    });

    const narrative = generateSkyNarrative(data, skyIntel);

    const state = skyIntel?.atmosphericState || "unknown";

    // UI TEXT
    document.getElementById("headline").textContent =
      narrative?.headline || "—";

    document.getElementById("detail").textContent =
      narrative?.detail || "—";

    document.getElementById("conditionLabel").textContent =
      state.replace("_"," ");

    // CHIP
    const chip = document.getElementById("chip");
    chip.textContent = state.replace("_"," ");
    chip.className = "chip " + mapChip(state);

    // CONFIDENCE
    const conf = Math.round((skyIntel?.confidence || 0) * 100);
    document.getElementById("confidenceBar").style.width = conf + "%";

    // IMAGE
    document.getElementById("skyImage").src =
      `./js/sky-cam/frame.jpg?t=${Date.now()}`;

    // DEBUG
    document.getElementById("metrics").textContent =
      JSON.stringify(data, null, 2);

    document.getElementById("intel").textContent =
      JSON.stringify(skyIntel, null, 2);

    document.getElementById("narrative").textContent =
      JSON.stringify(narrative, null, 2);

    // TIME
    document.getElementById("lastUpdate").textContent =
      "Last update: " + new Date().toLocaleTimeString();

    // MEMORY
    prev2 = prev1;
    prev1 = data;

  } catch (e) {
    console.error(e);
    document.getElementById("headline").textContent = "Data unavailable";
  }
}

async function loop() {
  await run();
  setTimeout(loop, 5000);
}

loop();

</script>
</body>
</html>
