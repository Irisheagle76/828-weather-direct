name: Update Hiking Guidance

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      WEATHERFLOW_API_KEY: ${{ secrets.WEATHERFLOW_API_KEY }}
      WEATHER_UNDERGROUND_API_KEY: ${{ secrets.WEATHER_UNDERGROUND_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh hiking guidance
        run: node scripts/update-hiking-guidance.mjs

      - name: Commit updated guidance
        run: |
          if git diff --quiet -- public/data/hiking-guidance.json; then
            echo "No hiking guidance changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hiking-guidance.json
          git commit -m "Update hiking guidance"
          git push

      - name: Record Fall Explorer shadow calibration
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://avlweather.com/api/router?route=observations/sample"
