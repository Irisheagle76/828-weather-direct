name: Update Hiking Guidance

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JCC_TEMPEST_TOKEN: ${{ secrets.JCC_TEMPEST_TOKEN }}
      TEMPEST_TOKEN: ${{ secrets.TEMPEST_TOKEN }}
      TEMPEST_STATION_ID: "127602"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test hiking refresh and observation handling
        run: node --test test/update-hiking-guidance.test.js test/hiking-guidance.test.js test/hiking-profile.test.js test/mobile-hiking-data.test.js test/elevation-observations.test.js test/fall-observations.test.js

      - name: Refresh hiking guidance
        run: node scripts/update-hiking-guidance.mjs

      - name: Commit updated guidance
        run: |
          if git diff --quiet -- public/data/hiking-guidance.json; then
            echo "No hiking guidance changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hiking-guidance.json
          git commit -m "Update hiking guidance [skip deploy]"
          git pull --rebase origin main
          git push

      - name: Record Fall Explorer calibration and cold milestones
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://avlweather.com/api/router?route=observations/sample"
