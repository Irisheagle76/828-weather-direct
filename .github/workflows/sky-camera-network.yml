name: Sky camera network captures
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scheduled-data-refresh
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install video frame capture tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Capture verified live views
        run: node scripts/capture-sky-camera-network.mjs
      - name: Commit camera data only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/sky-camera-observations/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update sky cam snapshot network [skip deploy]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
